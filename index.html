<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <title>Список дел</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 30px;
        }

        h1 {
            font-family: Georgia, serif;
            font-size: 36px;
            margin-bottom: 25px;
        }

        .controls {
            margin-bottom: 25px;
        }

        input[type="text"] {
            padding: 6px 8px;
            font-size: 16px;
            width: 240px;
            border: 1px solid #999;
            border-radius: 3px;
        }

        button {
            padding: 6px 12px;
            font-size: 16px;
            margin-left: 4px;
            border: 1px solid #999;
            border-radius: 3px;
            background: #f0f0f0;
            cursor: pointer;
        }

        button:hover {
            background: #e0e0e0;
        }

        ol {
            margin-left: 20px;
        }

        li {
            margin-bottom: 12px;
            font-size: 20px;
        }

        li input[type="checkbox"] {
            margin-right: 8px;
            transform: scale(1.2);
            vertical-align: middle;
        }

        .del {
            margin-left: 8px;
            padding: 2px 6px;
            color: red;
            font-size: 18px;
            background: #f0f0f0;
            border: 1px solid #999;
            border-radius: 3px;
            cursor: pointer;
            vertical-align: middle;
        }
    </style>
</head>

<body>

    <h1>Список дел</h1>

    <div class="controls">
        <input type="text" placeholder="Новый элемент списка">
        <button>Создать</button>
        <button>Очистить всё</button>
    </div>

    <ol>
        <li>
            <input type="checkbox"> Почесать кошку
            <button class="del">✖</button>
        </li>
        <li>
            <input type="checkbox"> Полить картошку
            <button class="del">✖</button>
        </li>
        <li>
            <input type="checkbox"> Сложить в лукошко
            <button class="del">✖</button>
        </li>
    </ol>

</body>

</html>
